
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 160 160"
     fill="none">

  <defs>
    <linearGradient id="purple"
      x1="20" y1="10" x2="100" y2="130"
      gradientUnits="userSpaceOnUse">
      <stop stop-color="#A58BFF"/>
      <stop offset=".55" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#5635DB"/>
    </linearGradient>

    <linearGradient id="teal"
      x1="75" y1="15" x2="145" y2="135"
      gradientUnits="userSpaceOnUse">
      <stop stop-color="#64F4D4"/>
      <stop offset=".5" stop-color="#22D3A7"/>
      <stop offset="1" stop-color="#0A9F91"/>
    </linearGradient>

    <linearGradient id="fold"
      x1="65" y1="85" x2="110" y2="135"
      gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3A7"/>
      <stop offset="1" stop-color="#3858B9"/>
    </linearGradient>
  </defs>

  <!-- Purple ribbon -->
  <path d="
    M23 25
    C18 15 28 7 40 11
    L55 16
    C65 19 72 27 78 38
    L111 103
    C116 114 112 126 101 132
    L88 139
    C77 145 65 139 60 128
    Z"
    fill="url(#purple)"/>

  <!-- Teal ribbon -->
  <path d="
    M126 15
    C137 7 149 15 144 27
    L105 111
    C99 125 90 136 77 140
    L88 139
    C101 138 111 130 117 118
    L153 40
    C160 24 146 8 130 11
    Z"
    fill="url(#teal)"/>

  <!-- Inner fold -->
  <path d="
    M77 140
    C86 130 94 117 101 102
    L119 65
    L93 94
    C83 105 75 117 68 127
    Z"
    fill="url(#fold)"/>

  <!-- Highlight -->
  <path d="M30 25 L68 99"
    stroke="#FFFFFF"
    stroke-opacity=".18"
    stroke-width="3"
    stroke-linecap="round"/>

</svg>
